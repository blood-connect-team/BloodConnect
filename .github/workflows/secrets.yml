# Secret scanning with the open-source Gitleaks CLI (https://github.com/gitleaks/gitleaks).
# The CLI is used directly (not gitleaks-action) because the action needs a licence key
# for organization-owned repositories; the CLI is free with no sign-up.
# On pull requests it scans ONLY the PR's own commits (base..head) with --redact,
# so detected values are not printed in logs.
# A manual run (workflow_dispatch) scans the full history; use it occasionally, not on every PR.
# Status check name: "gitleaks".
name: Secret scan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned scanner version. Bump deliberately (Dependabot does not update this).
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Check out repository (full history so the PR commit range resolves)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks (official release, checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${archive}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict -
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks "${archive}" "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          gitleaks version

      - name: Scan this pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --redact --verbose --exit-code 1 --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}" .

      - name: Scan full history (manual run only)
        if: github.event_name == 'workflow_dispatch'
        run: gitleaks git --redact --verbose --exit-code 1 .
