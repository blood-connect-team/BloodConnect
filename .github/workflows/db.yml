# Database pipeline for Supabase migrations (#16).
#
# Pull requests touching supabase/ -> job "db": start a real local Postgres with the Supabase CLI,
#   apply every migration (+ seed.sql), lint the schema, run the pgTAP tests in supabase/tests.
# Push to main touching supabase/migrations -> job "migrate-staging": apply new migrations to the
#   hosted STAGING project (environment "staging", main branch only).
#
# The staging connection uses one secret, SUPABASE_DB_URL (environment "staging"): the project's
# session-pooler connection string. It only reaches this one database, never the whole Supabase account.
# "db" is not a required check (path-filtered); database PRs also need a code-owner review.
name: Database

on:
  pull_request:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/db.yml"]
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  db:
    name: db
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: db-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0

      - name: Start local database (applies migrations and seed)
        run: supabase db start

      - name: Lint database schema
        run: supabase db lint --level warning --fail-on error

      - name: Run database tests (pgTAP)
        run: supabase test db

  migrate-staging:
    name: migrate-staging
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    # Never run two migration deploys at the same time.
    concurrency:
      group: migrate-staging
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0

      # Explains a malformed secret WITHOUT printing it (only yes/no facts are shown).
      - name: Check the connection string format
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          url="$SUPABASE_DB_URL"; problems=0
          report() { echo "::error::SUPABASE_DB_URL: $1"; problems=1; }
          [ -n "$url" ] || report "the secret is empty or not set in environment 'staging'."
          case "$url" in postgres://*|postgresql://*) ;; *) report "must start with postgresql:// (copy the whole 'Session pooler' line)." ;; esac
          case "$url" in *[[:space:]]*) report "contains spaces or line breaks; copy the string again without extra characters." ;; esac
          case "$url" in *'"'*|*"'"*) report "contains quote characters; remove them." ;; esac
          case "$url" in *'['*|*']'*) report "still contains [ ] brackets; replace the whole [YOUR-PASSWORD] (brackets included) with the password." ;; esac
          rest="${url#*://}"; ats="${rest//[^@]/}"
          [ "${#ats}" -eq 1 ] || report "the part after :// must contain exactly one '@'. If the password contains @ # / : ? % or spaces, URL-encode them (e.g. @ -> %40, # -> %23) or reset the database password to letters and digits."
          case "$rest" in *pooler.supabase.com:5432/*) ;; *) echo "::warning::Expected the Session pooler host (…pooler.supabase.com:5432). Other hosts may not be reachable from GitHub runners." ;; esac
          [ "$problems" -eq 0 ] && echo "Connection string format looks valid (length ${#url})."
          exit "$problems"

      # The dashboard shows "postgresql://…"; Supabase CLI 3 only accepts the "postgres://" scheme
      # (same meaning). Normalise it so the secret can be pasted exactly as shown.
      - name: Show pending migrations (dry run)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          db_url="${SUPABASE_DB_URL/#postgresql:\/\//postgres://}"
          supabase db push --remote="$db_url" --dry-run --yes

      - name: Apply migrations to staging
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          db_url="${SUPABASE_DB_URL/#postgresql:\/\//postgres://}"
          supabase db push --remote="$db_url" --yes
