# Continuous integration and delivery for Blood Connect.
# Required status check name for branch protection: "ci" (the job name below).
# Do NOT add paths-ignore here: a required check that never runs would block docs-only PRs.
#
# Delivery (Cloudflare Pages, free plan), only after the "ci" job passes:
#   - pull request  -> deploy-preview: a live preview link per PR branch ("preview" environment)
#   - push to main  -> deploy-production: waits for an approver in the "production" environment,
#                      then publishes the production site.
# Setup, secrets and rollback: docs/DEVOPS.md section 10.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

# PRs: a new push cancels the older run. main: every commit gets its own run
# (a production deploy waiting for approval must not block later CI runs).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PAGES_PROJECT: blood-connect
  WRANGLER_VERSION: "4.162.0"

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The build needs no environment variables: Vite only inlines VITE_* values that exist,
      # and the app reports missing configuration at runtime. No fake credentials are injected.
      - name: Production build
        run: npm run build

  deploy-preview:
    name: deploy-preview
    needs: ci
    # Same-repository PRs only (forks and Dependabot PRs get no deploy secrets).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      # Public frontend config for the PREVIEW environment (Settings → Environments → preview → Variables).
      # Never point previews at production data.
      - name: Build
        run: npm run build
        env:
          VITE_APPWRITE_ENDPOINT: ${{ vars.VITE_APPWRITE_ENDPOINT }}
          VITE_APPWRITE_PROJECT_ID: ${{ vars.VITE_APPWRITE_PROJECT_ID }}
          VITE_APPWRITE_DATABASE_ID: ${{ vars.VITE_APPWRITE_DATABASE_ID }}
          VITE_APPWRITE_DONORS_COLLECTION_ID: ${{ vars.VITE_APPWRITE_DONORS_COLLECTION_ID }}
          VITE_APPWRITE_REQUESTS_COLLECTION_ID: ${{ vars.VITE_APPWRITE_REQUESTS_COLLECTION_ID }}

      - name: Make a safe preview branch name
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: echo "name=$(printf '%s' "$HEAD_REF" | tr -c 'A-Za-z0-9-' '-' | cut -c1-50)" >> "$GITHUB_OUTPUT"

      - name: Ensure the Pages project exists (first run only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes "wrangler@${WRANGLER_VERSION}" pages project list | grep -qw "${PAGES_PROJECT}"; then
            echo "Pages project ${PAGES_PROJECT} exists."
          else
            npx --yes "wrangler@${WRANGLER_VERSION}" pages project create "${PAGES_PROJECT}" --production-branch=main
          fi

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=${{ steps.branch.outputs.name }} --commit-dirty=true

  deploy-production:
    name: deploy-production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The "production" environment requires an approver before this job starts.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    # One production deploy at a time; a newer waiting deploy replaces an older waiting one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      # Public frontend config for PRODUCTION (Settings → Environments → production → Variables).
      - name: Build
        run: npm run build
        env:
          VITE_APPWRITE_ENDPOINT: ${{ vars.VITE_APPWRITE_ENDPOINT }}
          VITE_APPWRITE_PROJECT_ID: ${{ vars.VITE_APPWRITE_PROJECT_ID }}
          VITE_APPWRITE_DATABASE_ID: ${{ vars.VITE_APPWRITE_DATABASE_ID }}
          VITE_APPWRITE_DONORS_COLLECTION_ID: ${{ vars.VITE_APPWRITE_DONORS_COLLECTION_ID }}
          VITE_APPWRITE_REQUESTS_COLLECTION_ID: ${{ vars.VITE_APPWRITE_REQUESTS_COLLECTION_ID }}

      - name: Ensure the Pages project exists (first run only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes "wrangler@${WRANGLER_VERSION}" pages project list | grep -qw "${PAGES_PROJECT}"; then
            echo "Pages project ${PAGES_PROJECT} exists."
          else
            npx --yes "wrangler@${WRANGLER_VERSION}" pages project create "${PAGES_PROJECT}" --production-branch=main
          fi

      - name: Deploy production to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-dirty=true
